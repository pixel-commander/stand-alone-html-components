<div class="grid demo-atom-set">
  <div class="grid" data-mod="base">
    <span class="demo-atom-label">.text-carved</span>
    <p class="ui-title text-carved">Cut into the surface</p>
  </div>
  <div class="grid" data-mod="deep">
    <span class="demo-atom-label">.text-carved.deep</span>
    <p class="ui-title text-carved deep">Cut deeper</p>
  </div>
  <div class="grid" data-mod="raised">
    <span class="demo-atom-label">.text-carved.raised — embossed</span>
    <p class="ui-title text-carved raised">Standing off it</p>
  </div>
  <div class="grid" data-mod="quiet">
    <span class="demo-atom-label">.text-carved.quiet</span>
    <p class="ui-subtitle text-carved quiet">A label, barely scored</p>
  </div>
  <div class="grid" data-mod="small">
    <span class="demo-atom-label">.text-carved at --text-sm — too small, shown as a warning</span>
    <p class="ui-hint text-carved">Below about 14px the bevel eats the stroke</p>
  </div>
</div>
