<div class="grid demo-atom-set">
  <div class="grid" data-mod="base">
    <span class="demo-atom-label">.scan-button — click it</span>
    <button class="scan-button" type="button" data-scan aria-label="Scan">
      <span class="container-domed scan-button-face round"></span>
      <span class="scan-button-print">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M14 62a44 44 0 0 1 72 0"/>
          <path d="M22 70a34 34 0 0 1 56 0"/>
          <path d="M30 78a24 24 0 0 1 40 0"/>
          <path d="M38 86a14 14 0 0 1 24 0"/>
          <path d="M46 94a5 5 0 0 1 8 0"/>
        </svg>
      </span>
      <span class="scan-button-note" data-scan-note>touch to scan</span>
    </button>
  </div>

  <div class="grid" data-mod="small">
    <span class="demo-atom-label">.scan-button.small</span>
    <button class="scan-button small" type="button" data-scan aria-label="Scan">
      <span class="container-domed scan-button-face round"></span>
      <span class="scan-button-print">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M14 62a44 44 0 0 1 72 0"/>
          <path d="M22 70a34 34 0 0 1 56 0"/>
          <path d="M30 78a24 24 0 0 1 40 0"/>
          <path d="M38 86a14 14 0 0 1 24 0"/>
          <path d="M46 94a5 5 0 0 1 8 0"/>
        </svg>
      </span>
    </button>
  </div>

  <div class="grid" data-mod="is-dirty">
    <span class="demo-atom-label">.scan-button.is-dirty — mid scan</span>
    <button class="scan-button is-dirty" type="button" aria-label="Scanning">
      <span class="container-domed scan-button-face round"></span>
      <span class="scan-button-print">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M14 62a44 44 0 0 1 72 0"/>
          <path d="M22 70a34 34 0 0 1 56 0"/>
          <path d="M30 78a24 24 0 0 1 40 0"/>
          <path d="M38 86a14 14 0 0 1 24 0"/>
          <path d="M46 94a5 5 0 0 1 8 0"/>
        </svg>
      </span>
      <span class="scan-button-note">reading</span>
    </button>
  </div>

  <div class="grid" data-mod="is-selected">
    <span class="demo-atom-label">.scan-button.is-selected — accepted</span>
    <button class="scan-button is-selected" type="button" aria-label="Accepted">
      <span class="container-domed scan-button-face round"></span>
      <span class="scan-button-print">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path d="M14 62a44 44 0 0 1 72 0"/>
          <path d="M22 70a34 34 0 0 1 56 0"/>
          <path d="M30 78a24 24 0 0 1 40 0"/>
          <path d="M38 86a14 14 0 0 1 24 0"/>
          <path d="M46 94a5 5 0 0 1 8 0"/>
        </svg>
      </span>
      <span class="scan-button-note">accepted</span>
    </button>
  </div>
</div>
