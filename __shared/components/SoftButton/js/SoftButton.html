<div class="grid demo-atom-set">
  <div class="grid" data-mod="round">
    <span class="demo-atom-label">.soft-button — round, hover it</span>
    <button class="soft-button" type="button">
      <span class="container-raised soft-button-glow mid round"></span>
      <span class="soft-button-label">Submit</span>
    </button>
  </div>

  <div class="grid" data-mod="long">
    <span class="demo-atom-label">.soft-button.long</span>
    <button class="soft-button long" type="button">
      <span class="container-raised soft-button-glow mid pill"></span>
      <span class="soft-button-label">Submit</span>
    </button>
  </div>

  <div class="grid" data-mod="small">
    <span class="demo-atom-label">.soft-button.small</span>
    <button class="soft-button small" type="button">
      <span class="container-raised soft-button-glow mid round"></span>
      <span class="soft-button-label">Go</span>
    </button>
  </div>

  <div class="grid" data-mod="is-disabled">
    <span class="demo-atom-label">.soft-button.is-disabled</span>
    <button class="soft-button is-disabled" type="button" disabled>
      <span class="container-raised soft-button-glow mid round"></span>
      <span class="soft-button-label">Submit</span>
    </button>
  </div>
</div>
