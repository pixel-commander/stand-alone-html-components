<div class="grid specimen-set">
  <article class="specimen grid">
    <div class="specimen-stage grid">
      <div class="container-raised specimen-shape"></div>
    </div>
    <span class="specimen-cap">raised</span>
    <span class="specimen-name">container-raised</span>
    <div class="grid specimen-rows">
      <div class="specimen-row grid"><b>layers</b><span>8</span></div>
      <div class="specimen-row grid"><b>reach</b><span>2.125rem</span></div>
      <div class="specimen-row grid"><b>shadow</b><span class="specimen-swatch shadow"></span></div>
      <div class="specimen-row grid"><b>highlight</b><span class="specimen-swatch highlight"></span></div>
    </div>
  </article>

  <article class="specimen grid">
    <div class="specimen-stage grid">
      <div class="container-sunken specimen-shape"></div>
    </div>
    <span class="specimen-cap">sunken</span>
    <span class="specimen-name">container-sunken</span>
    <div class="grid specimen-rows">
      <div class="specimen-row grid"><b>layers</b><span>8, inset</span></div>
      <div class="specimen-row grid"><b>reach</b><span>2.125rem</span></div>
      <div class="specimen-row grid"><b>shadow</b><span class="specimen-swatch shadow"></span></div>
      <div class="specimen-row grid"><b>highlight</b><span class="specimen-swatch highlight"></span></div>
    </div>
  </article>

  <article class="specimen grid">
    <div class="specimen-stage grid">
      <div class="container-raised specimen-shape round ring">
        <div class="container-sunken specimen-shape round"></div>
      </div>
    </div>
    <span class="specimen-cap">both at once</span>
    <span class="specimen-name">the ring</span>
    <div class="grid specimen-rows">
      <div class="specimen-row grid"><b>outer</b><span>raised</span></div>
      <div class="specimen-row grid"><b>inner</b><span>sunken</span></div>
      <div class="specimen-row grid"><b>surface</b><span class="specimen-swatch surface"></span></div>
    </div>
  </article>
</div>
