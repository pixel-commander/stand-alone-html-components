<div class="style-toggle grid" data-style-toggle>
  <label class="style-toggle-switch">
    <input type="checkbox" data-mode aria-label="Light surface">
    <span class="container-sunken style-toggle-track pill" data-track>
      <span class="container-raised style-toggle-knob round" data-knob></span>
    </span>
  </label>
  <div class="style-toggle-styles grid" role="radiogroup" aria-label="Material">
    <label class="style-toggle-style is-selected">
      <input type="radio" name="style" value="neumorphism" checked>
      Neumorphism
    </label>
    <label class="style-toggle-style">
      <input type="radio" name="style" value="skeuomorphism">
      Skeuomorphism
    </label>
    <label class="style-toggle-style">
      <input type="radio" name="style" value="domed">
      Domed
    </label>
  </div>
</div>
