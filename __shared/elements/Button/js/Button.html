<div class="grid demo-atom-set">
  <div class="grid" data-mod="base">
    <span class="demo-atom-label">.button-main.button</span>
    <button class="button-main button">Back</button>
  </div>
  <div class="grid" data-mod="accent">
    <span class="demo-atom-label">.button-main.button.accent</span>
    <button class="button-main button accent">Continue</button>
  </div>
  <div class="grid" data-mod="small">
    <span class="demo-atom-label">.button-main.button.small</span>
    <button class="button-main button small">Small</button>
  </div>
  <div class="grid" data-mod="wide">
    <span class="demo-atom-label">.button-main.button.wide</span>
    <button class="button-main button wide">Full width</button>
  </div>
  <div class="grid" data-mod="is-disabled">
    <span class="demo-atom-label">.button-main.button.is-disabled</span>
    <button class="button-main button is-disabled" disabled>Disabled</button>
  </div>
</div>
