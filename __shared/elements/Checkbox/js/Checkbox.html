<div class="grid demo-atom-set">
  <div class="grid" data-mod="base">
    <span class="demo-atom-label">.checkbox + .checkbox-box.tight</span>
    <label class="checkbox">
      <input type="checkbox">
      <span class="container-raised checkbox-box tight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 5 5L20 7"/></svg></span>
    </label>
  </div>
  <div class="grid" data-mod="checked">
    <span class="demo-atom-label">.checkbox-box.tight.is-active</span>
    <label class="checkbox">
      <input type="checkbox" checked>
      <span class="container-raised checkbox-box tight is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 5 5L20 7"/></svg></span>
    </label>
  </div>
  <div class="grid" data-mod="large">
    <span class="demo-atom-label">.checkbox.large</span>
    <label class="checkbox large">
      <input type="checkbox" checked>
      <span class="container-raised checkbox-box tight is-active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 5 5L20 7"/></svg></span>
    </label>
  </div>
</div>
