<div class="grid demo-atom-set">
  <div class="grid" data-mod="base">
    <span class="demo-atom-label">plate + cup</span>
    <div class="container-socket plate round socket">
      <div class="container-socket round socket-cup"></div>
    </div>
  </div>

  <div class="grid" data-mod="seated">
    <span class="demo-atom-label">plate + cup + a domed face seated in it</span>
    <div class="container-socket plate round socket">
      <div class="container-socket round socket-cup">
        <div class="container-domed round socket-face"></div>
      </div>
    </div>
  </div>

  <div class="grid" data-mod="small">
    <span class="demo-atom-label">.socket.small</span>
    <div class="container-socket plate round socket small">
      <div class="container-socket round socket-cup"></div>
    </div>
  </div>

  <div class="grid" data-mod="flat">
    <span class="demo-atom-label">.socket.flat — a trough, not a cup</span>
    <div class="container-socket plate base socket flat">
      <div class="container-socket base socket-cup grid">
        <span class="socket-label">seated content</span>
      </div>
    </div>
  </div>
</div>
