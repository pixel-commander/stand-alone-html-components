<div class="grid demo-atom-set">
  <div class="grid" data-mod="base">
    <span class="demo-atom-label">.container-sunken.switch.pill</span>
    <label class="container-sunken switch pill">
      <input type="checkbox" checked>
      <span class="container-raised switch-handle tight round"></span>
    </label>
  </div>
  <div class="grid" data-mod="off">
    <span class="demo-atom-label">.container-sunken.switch.pill — unchecked</span>
    <label class="container-sunken switch pill">
      <input type="checkbox">
      <span class="container-raised switch-handle tight round"></span>
    </label>
  </div>
  <div class="grid" data-mod="large">
    <span class="demo-atom-label">.container-sunken.switch.pill.large</span>
    <label class="container-sunken switch pill large">
      <input type="checkbox" checked>
      <span class="container-raised switch-handle tight round"></span>
    </label>
  </div>
</div>
