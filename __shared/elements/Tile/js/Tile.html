<div class="grid demo-atom-set">
  <div class="grid" data-mod="base">
    <span class="demo-atom-label">.button-main.tile.pill + side-l</span>
    <button class="button-main tile grid side-l pill">
      <div data-area="side"><i class="container-sunken avatar round tight">JR</i></div>
      <div data-area="main"><span class="tile-title">Jules</span></div>
    </button>
  </div>
  <div class="grid" data-mod="wide">
    <span class="demo-atom-label">.button-main.tile.pill.wide</span>
    <button class="button-main tile grid side-l pill wide">
      <div data-area="side"><i class="container-sunken avatar round tight accent-tertiary">MW</i></div>
      <div data-area="main">
        <span class="tile-title">Mara Whitlock</span>
        <span class="tile-note">Design systems</span>
      </div>
    </button>
  </div>
</div>
