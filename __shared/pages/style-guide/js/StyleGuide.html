<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft material — style guide</title>
<link rel="stylesheet" href="../../../theme/theme.css">
<link rel="stylesheet" href="../../../theme/soft-light.css">
<link rel="stylesheet" href="../../../theme/soft-dark.css">
<link rel="stylesheet" href="../../../css/grid.css">
<link rel="stylesheet" href="../../../css/demo.css">
<link rel="stylesheet" href="../../../atoms/imports.css">
<link rel="stylesheet" href="../../../elements/imports.css">
<link rel="stylesheet" href="../../../components/imports.css">
<link rel="stylesheet" href="../css/style-guide.css">
</head>
<body class="theme-soft-dark no-overflow container-grain fixed">

<div class="guide grid with-header">

  <header class="guide-head grid" data-area="header">
    <div class="guide-mark grid">
      <span class="container-sunken avatar round tight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 15c4-9 12-9 16 0"/><circle cx="12" cy="15" r="2.4"/></svg></span>
      <div>
        <b>Soft material</b>
        <span>atoms, elements, components</span>
      </div>
    </div>
    <div class="guide-options grid">
      <nav class="container-sunken tab-nav grid pill tight" data-tiers role="tablist"></nav>
      <div class="guide-options guide-accents grid" data-accents></div>
      <label class="slider" data-softness>
        <input type="range" min="50" max="200" value="100" aria-label="Softness">
      </label>
      <label class="container-sunken switch pill" data-mode>
        <input type="checkbox" aria-label="Dark">
        <span class="container-raised switch-handle tight round"></span>
      </label>
    </div>
  </header>

  <div class="guide-body grid" data-area="main">

    <aside class="container-pane inset guide-side grid scroll-area" data-area="side">
      <div class="guide-side-head">
        <span class="ui-label" data-tier-name>Atoms</span>
      </div>
      <nav class="site-nav grid scroll-y" data-items aria-label="Parts"></nav>
    </aside>

    <div class="container-raised guide-stage-frame grid with-header" data-area="main">
      <div class="guide-stage-head grid" data-area="header">
        <div>
          <span class="guide-stage-name" data-part-name>—</span>
          <span class="guide-stage-path" data-part-path></span>
        </div>
        <nav class="container-sunken tab-nav grid pill tight wrap full is-hidden" data-mods role="tablist"></nav>
      </div>
      <div class="guide-scroll grid scroll-y scroll-area" data-area="main">
        <div class="container-sunken guide-stage grid mid" data-stage></div>
        <div class="guide-keys grid is-hidden" data-keys></div>
        <div class="container-sunken guide-notes grid mid" data-notes><pre></pre></div>
      </div>
    </div>

  </div>
</div>

<script type="module" src="./style-guide.js"></script>
</body>
</html>
