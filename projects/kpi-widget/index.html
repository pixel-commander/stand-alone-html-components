<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kpi-widget</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="kpi-widget flex flex-wrap justify-center gap-y-4 gap-x-8 p-4 box-border">
  <div class="tile grid grid-rows-[auto_auto] w-max text-center">
    <div class="title font-semibold text-[#1a8a3f]">Running (4)</div>
    <div class="label text-[#6f7276] text-[12px]">Climate System State</div>
  </div>
  <div class="tile grid grid-rows-[auto_auto] w-max text-center">
    <div class="title font-semibold text-[#1a8a3f]">Running (4)</div>
    <div class="label text-[#6f7276] text-[12px]">Main Fan State</div>
  </div>
  <div class="tile grid grid-rows-[auto_auto] w-max text-center">
    <div class="title font-semibold text-[#1565c0]">Waiting to be selected (1)</div>
    <div class="label text-[#6f7276] text-[12px]">ADF State</div>
  </div>
</div>
<script src="settings.js"></script>
<script src="script.js"></script>
</body>
</html>
