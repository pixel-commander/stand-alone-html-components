<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>styled-dl</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="styled-dl min-h-0 overflow-auto">
  <dl class="pr-2 grid grid-cols-[auto_auto] m-0">
    <dt class="label-cell py-1.5 border-t border-[#e0e0e0] first:border-t-0">Machine</dt>
    <dd class="value-cell py-1.5 border-t border-[#e0e0e0] m-0 text-right [&:nth-child(2)]:border-t-0">Filler 04</dd>
    <dt class="label-cell py-1.5 border-t border-[#e0e0e0]">State</dt>
    <dd class="value-cell py-1.5 border-t border-[#e0e0e0] m-0 text-right">Running</dd>
    <dt class="label-cell py-1.5 border-t border-[#e0e0e0]">Recipe</dt>
    <dd class="value-cell py-1.5 border-t border-[#e0e0e0] m-0 text-right">Lager 500ml</dd>
    <dt class="label-cell py-1.5 border-t border-[#e0e0e0]">Throughput</dt>
    <dd class="value-cell py-1.5 border-t border-[#e0e0e0] m-0 text-right">482 bph</dd>
    <dt class="label-cell py-1.5 border-t border-[#e0e0e0]">Temperature</dt>
    <dd class="value-cell py-1.5 border-t border-[#e0e0e0] m-0 text-right">4.2 C</dd>
    <dt class="label-cell py-1.5 border-t border-[#e0e0e0]">Last fault</dt>
    <dd class="value-cell py-1.5 border-t border-[#e0e0e0] m-0 text-right">06:41 door open</dd>
  </dl>
</div>
<script src="settings.js"></script>
<script src="script.js"></script>
</body>
</html>
